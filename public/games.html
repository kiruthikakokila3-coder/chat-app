<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>500 Mini Games 🎮</title>

<style>
body{
  margin:0;
  font-family:Arial;
  text-align:center;
  color:white;
  background:url("https://wallpaperaccess.com/full/2637581.jpg") no-repeat center/cover;
}

.box{
  margin:50px auto;
  width:90%;
  max-width:400px;
  background:rgba(0,0,0,0.7);
  padding:20px;
  border-radius:20px;
}

button{
  padding:10px 20px;
  margin:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

</style>
</head>

<body>

<div class="box">

<h2>🎮 Mini Games Hub</h2>

<p id="gameTitle"></p>

<div id="game"></div>

<button onclick="next()">Next Game 🔄</button>

</div>

<script>

// 🎮 10 BASE GAMES (auto 500 variation)
const games = [

function guessGame(){
  let x=Math.floor(Math.random()*10);
  game.innerHTML=`
    <p>Guess 0-9</p>
    <input id="n">
    <button onclick="check()">Try</button>
    <p id="out"></p>
  `;
  window.check=()=>{
    out.innerText = n.value==x?"Win 😎":"Try 😅";
  }
},

function clickGame(){
  let score=0;
  game.innerHTML=`
    <p>Click fast!</p>
    <button onclick="add()">Click</button>
    <p id="s">0</p>
  `;
  window.add=()=>{
    score++;
    s.innerText=score;
  }
},

function mathGame(){
  let a=Math.floor(Math.random()*10);
  let b=Math.floor(Math.random()*10);
  game.innerHTML=`
    <p>${a} + ${b} = ?</p>
    <input id="ans">
    <button onclick="check()">OK</button>
    <p id="r"></p>
  `;
  window.check=()=>{
    r.innerText = ans.value==(a+b)?"Correct":"Wrong";
  }
},

function colorGame(){
  let colors=["red","blue","green"];
  let c=colors[Math.floor(Math.random()*3)];
  game.innerHTML=`
    <p>Click ${c}</p>
    ${colors.map(x=>`<button onclick="check('${x}')">${x}</button>`).join("")}
    <p id="r"></p>
  `;
  window.check=(x)=>{
    r.innerText = x==c?"Correct":"Wrong";
  }
},

function memoryGame(){
  let n=Math.floor(Math.random()*100);
  game.innerHTML=`
    <p>Remember: ${n}</p>
    <button onclick="hide()">Hide</button>
    <input id="g">
    <button onclick="check()">Check</button>
    <p id="r"></p>
  `;
  window.hide=()=>game.querySelector("p").innerText="???";
  window.check=()=>{
    r.innerText = g.value==n?"Correct":"Wrong";
  }
},

function loveGame(){
  let p=Math.floor(Math.random()*100);
  game.innerHTML=`
    <p>Love % = ${p}% 💖</p>
  `;
},

function speedGame(){
  let start;
  game.innerHTML=`
    <p>Wait... then click!</p>
    <button onclick="click()">Click</button>
    <p id="r"></p>
  `;
  setTimeout(()=>start=Date.now(),2000);
  window.click=()=>{
    r.innerText = (Date.now()-start)+" ms";
  }
},

function numberGame(){
  let n=Math.floor(Math.random()*5);
  game.innerHTML=`
    <p>Find number ${n}</p>
    ${[0,1,2,3,4].map(x=>`<button onclick="c(${x})">${x}</button>`).join("")}
    <p id="r"></p>
  `;
  window.c=(x)=>r.innerText = x==n?"Win":"Lose";
},

function emojiGame(){
  let e=["😀","😍","😎"];
  let x=e[Math.floor(Math.random()*3)];
  game.innerHTML=`
    <p>Find ${x}</p>
    ${e.map(i=>`<button onclick="c('${i}')">${i}</button>`).join("")}
    <p id="r"></p>
  `;
  window.c=(i)=>r.innerText=i==x?"Correct":"Wrong";
},

function typingGame(){
  let w="love";
  game.innerHTML=`
    <p>Type: ${w}</p>
    <input id="t">
    <button onclick="c()">Check</button>
    <p id="r"></p>
  `;
  window.c=()=>r.innerText = t.value==w?"Perfect":"Try";
}

];

// load random game
function next(){
  let g = games[Math.floor(Math.random()*games.length)];
  gameTitle.innerText="Game "+Math.floor(Math.random()*500);
  g();
}

// start
next();

</script>

</body>
</html>
