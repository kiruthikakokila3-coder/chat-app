<!DOCTYPE html>
<html>
<head>
<title>Room</title>
</head>
<body style="text-align:center">

<h2>Select Chat Type</h2>

<button onclick="goPublic()">🌍 Public</button>
<button onclick="goPrivate()">🔒 Private</button>

<script>
function goPublic(){
  localStorage.setItem("room","public");
  window.location.href = "/chat.html";
}

function goPrivate(){
  localStorage.setItem("room","private");
  window.location.href = "/chat.html";
}
</script>

</body>
</html>
