<script src="/socket.io/socket.io.js"></script>
<link rel="stylesheet" href="style.css">

<h2>Private Chat</h2>

<input id="room" placeholder="Room name">
<button onclick="join()">Join</button>

<input id="msg">
<button onclick="send()">Send</button>

<div id="chat"></div>

<script>
const socket=io();
let r="";

function join(){
 r=room.value;
 socket.emit("join",r);
}

function send(){
 add(msg.value,true);
 socket.emit("private",{room:r,msg:msg.value});
}

socket.on("private",(m)=>{
 add(m,false);
});

function add(m,me){
 let d=document.createElement("div");
 d.className="msg "+(me?"right":"left");
 d.innerText=m;
 chat.appendChild(d);
}
</script>
