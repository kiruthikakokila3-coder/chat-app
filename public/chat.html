<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Real Chat App</title>

<script src="/socket.io/socket.io.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0b141a;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.app{
width:100%;
max-width:420px;
height:100vh;
background:#111b21;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* SETUP */

.setup{
padding:20px;
display:flex;
flex-direction:column;
gap:12px;
}

.setup h2{
text-align:center;
margin-bottom:10px;
}

.setup input,
.setup select{
height:50px;
border:none;
outline:none;
padding:0 15px;
border-radius:12px;
background:#202c33;
color:white;
font-size:15px;
}

.setup button{
height:50px;
border:none;
border-radius:12px;
background:#00a884;
color:white;
font-size:16px;
cursor:pointer;
}

/* CHAT */

.chat{
display:none;
flex-direction:column;
height:100%;
}

/* TOP */

.top{
background:#202c33;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.room-info{
display:flex;
flex-direction:column;
}

.room-title{
font-size:18px;
font-weight:bold;
}

.users{
font-size:12px;
color:#00d95f;
margin-top:3px;
}

.typing{
font-size:12px;
color:orange;
margin-top:2px;
}

.exit-btn{
background:red;
border:none;
padding:8px 15px;
border-radius:10px;
color:white;
cursor:pointer;
}

/* CHAT BOX */

.chat-box{
flex:1;
padding:15px;
overflow-y:auto;
background:url('https://i.imgur.com/6Iej2c3.jpeg');
background-size:cover;
}

.msg{
max-width:75%;
padding:10px 14px;
margin-bottom:10px;
border-radius:14px;
word-wrap:break-word;
position:relative;
}

.sent{
background:#005c4b;
margin-left:auto;
}

.receive{
background:#202c33;
}

.time{
font-size:10px;
margin-top:5px;
opacity:0.7;
text-align:right;
}

img.chat-image{
width:100%;
border-radius:10px;
margin-top:5px;
}

/* INPUT */

.bottom{
background:#202c33;
padding:10px;
display:flex;
align-items:center;
gap:8px;
}

.bottom input{
flex:1;
height:45px;
border:none;
outline:none;
border-radius:25px;
padding:0 15px;
background:#2a3942;
color:white;
font-size:15px;
}

.send-btn,
.image-btn{
width:45px;
height:45px;
border:none;
border-radius:50%;
background:#00a884;
color:white;
font-size:18px;
cursor:pointer;
}

#imageInput{
display:none;
}

</style>
</head>

<body>

<div class="app">

<!-- SETUP -->

<div class="setup" id="setup">

<h2>🔥 Real Chat App</h2>

<input
type="text"
id="userName"
placeholder="Your Name">

<input
type="text"
id="roomName"
placeholder="Room Name">

<input
type="password"
id="password"
placeholder="Password">

<select id="roomType">

<option value="public">
Public Room
</option>

<option value="private">
Private Room (2 Users)
</option>

</select>

<button onclick="createRoom()">
Create Room
</button>

<button onclick="joinRoom()">
Join Room
</button>

</div>

<!-- CHAT -->

<div class="chat" id="chat">

<!-- TOP -->

<div class="top">

<div class="room-info">

<div
class="room-title"
id="roomTitle">
Room
</div>

<div
class="users"
id="roomUsers">
0 Online
</div>

<div
class="typing"
id="typing">
</div>

</div>

<button
class="exit-btn"
id="exitBtn">
Exit
</button>

</div>

<!-- CHAT BOX -->

<div
class="chat-box"
id="chatBox">
</div>

<!-- INPUT -->

<div class="bottom">

<label class="image-btn">
📷
<input
type="file"
id="imageInput"
accept="image/*">
</label>

<input
type="text"
id="messageInput"
placeholder="Type message...">

<button
class="send-btn"
onclick="sendMessage()">
➤
</button>

</div>

</div>

</div>

<script>

const socket = io()

const setup =
document.getElementById("setup")

const chat =
document.getElementById("chat")

const roomTitle =
document.getElementById("roomTitle")

const roomUsers =
document.getElementById("roomUsers")

const typing =
document.getElementById("typing")

const chatBox =
document.getElementById("chatBox")

const messageInput =
document.getElementById("messageInput")

const imageInput =
document.getElementById("imageInput")

let currentUser = ""

// CREATE ROOM

function createRoom(){

currentUser =
document.getElementById("userName").value

socket.emit("create room",{

userName:currentUser,

roomName:
document.getElementById("roomName").value,

password:
document.getElementById("password").value,

type:
document.getElementById("roomType").value

})

}

// JOIN ROOM

function joinRoom(){

currentUser =
document.getElementById("userName").value

socket.emit("join room",{

userName:currentUser,

roomName:
document.getElementById("roomName").value,

password:
document.getElementById("password").value

})

}

// ROOM JOINED

socket.on("room joined",(room)=>{

setup.style.display = "none"

chat.style.display = "flex"

roomTitle.innerText = room

})

// ONLINE USERS

socket.on("room users",(users)=>{

roomUsers.innerText =
users.length + " Online"

})

// SEND MESSAGE

function sendMessage(){

const msg = messageInput.value.trim()

if(msg === "") return

addMessage(
currentUser,
msg,
"sent"
)

socket.emit(
"chat message",
msg
)

messageInput.value = ""

socket.emit("stop typing")

}

// ENTER SEND

messageInput
.addEventListener(
"keypress",
(e)=>{

socket.emit("typing")

if(e.key === "Enter"){
sendMessage()
}

}
)

// RECEIVE MESSAGE

socket.on(
"chat message",
(data)=>{

addMessage(
data.name,
data.message,
"receive"
)

}
)

// ADD MESSAGE

function addMessage(
name,
message,
type
){

const div =
document.createElement("div")

div.classList.add("msg")
div.classList.add(type)

const time =
new Date().toLocaleTimeString([],{
hour:"2-digit",
minute:"2-digit"
})

div.innerHTML = `
<b>${name}</b><br>
${message}
<div class="time">${time}</div>
`

chatBox.appendChild(div)

chatBox.scrollTop =
chatBox.scrollHeight

}

// TYPING

socket.on(
"typing",
(name)=>{

typing.innerText =
name + " typing..."

}
)

socket.on(
"stop typing",
()=>{

typing.innerText = ""

}
)

// AUTO STOP TYPING

messageInput
.addEventListener(
"keyup",
()=>{

clearTimeout(
window.typingTimeout
)

window.typingTimeout =
setTimeout(()=>{

socket.emit(
"stop typing"
)

},1000)

}
)

// EXIT

document
.getElementById("exitBtn")
.addEventListener(
"click",
()=>{

socket.disconnect()

location.reload()

}
)

// IMAGE PREVIEW

imageInput
.addEventListener(
"change",
()=>{

const file =
imageInput.files[0]

if(!file) return

const reader =
new FileReader()

reader.onload = ()=>{

const div =
document.createElement("div")

div.classList.add("msg")
div.classList.add("sent")

div.innerHTML = `
<b>${currentUser}</b><br>

<img
src="${reader.result}"
class="chat-image">

<div class="time">
${new Date()
.toLocaleTimeString([],{
hour:"2-digit",
minute:"2-digit"
})}
</div>
`

chatBox.appendChild(div)

chatBox.scrollTop =
chatBox.scrollHeight

socket.emit(
"chat image",
reader.result
)

}

reader.readAsDataURL(file)

}
)

// RECEIVE IMAGE

socket.on(
"chat image",
(data)=>{

const div =
document.createElement("div")

div.classList.add("msg")
div.classList.add("receive")

div.innerHTML = `
<b>${data.name}</b><br>

<img
src="${data.image}"
class="chat-image">

<div class="time">
${new Date()
.toLocaleTimeString([],{
hour:"2-digit",
minute:"2-digit"
})}
</div>
`

chatBox.appendChild(div)

chatBox.scrollTop =
chatBox.scrollHeight

}
)

// ERROR

socket.on(
"error message",
(msg)=>{

alert(msg)

}
)

</script>

</body>
</html>
