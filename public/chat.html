<script src="/socket.io/socket.io.js"></script>

<h2>Public Chat</h2>

<input id="msg">
<button onclick="send()">Send</button>

<div id="chat"></div>

<script>
const socket = io();

function send() {
  socket.emit("public message", msg.value);
}

socket.on("public message", (m) => {
  chat.innerHTML += "<p>" + m + "</p>";
});
</script>
