<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Find Love Chat 💬</title>

  <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      display: flex;
      height: 100vh;
      background: #111;
      color: #fff;
    }

    .sidebar {
      width: 30%;
      background: #1f1f1f;
      border-right: 1px solid #333;
      overflow-y: auto;
    }

    .user {
      padding: 15px;
      border-bottom: 1px solid #333;
      cursor: pointer;
    }

    .user:hover {
      background: #333;
    }

    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
    }

    .msg {
      margin: 10px 0;
      padding: 10px;
      border-radius: 10px;
      max-width: 60%;
    }

    .me {
      background: #00a884;
      margin-left: auto;
    }

    .other {
      background: #222;
    }

    .input {
      display: flex;
      padding: 10px;
      background: #1f1f1f;
    }

    input {
      flex: 1;
      padding: 10px;
      border: none;
      outline: none;
    }

    button {
      padding: 10px;
      background: #00a884;
      border: none;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- 👥 USERS LIST -->
  <div class="sidebar" id="users"></div>

  <!-- 💬 CHAT AREA -->
  <div class="chat">
    <div class="messages" id="messages"></div>

    <div class="input">
      <input id="msgInput" placeholder="Type message..." />
      <button onclick="sendMsg()">Send</button>
    </div>
  </div>

<script>
const socket = io("http://localhost:3000");

let myId = localStorage.getItem("userId");
let token = localStorage.getItem("token");
let currentChatUser = null;

// 🔐 JOIN
socket.emit("join", myId);

// 📥 LOAD USERS
async function loadUsers() {
  const res = await fetch("http://localhost:3000/api/users", {
    headers: { Authorization: "Bearer " + token }
  });

  const users = await res.json();
  const usersDiv = document.getElementById("users");

  usersDiv.innerHTML = "";

  users.forEach(u => {
    const div = document.createElement("div");
    div.className = "user";
    div.innerText = u.name;

    div.onclick = () => openChat(u._id, u.name);

    usersDiv.appendChild(div);
  });
}

loadUsers();


// 💬 OPEN CHAT
async function openChat(userId, name) {
  currentChatUser = userId;

  document.getElementById("messages").innerHTML = `<h3>${name}</h3>`;

  const res = await fetch(`http://localhost:3000/api/messages/private/${userId}`, {
    headers: { Authorization: "Bearer " + token }
  });

  const messages = await res.json();

  messages.forEach(m => addMessage(m));
}


// ➕ ADD MESSAGE
function addMessage(m) {
  const div = document.createElement("div");
  div.className = "msg " + (m.sender === myId ? "me" : "other");
  div.innerText = m.message;

  document.getElementById("messages").appendChild(div);
}


// 📤 SEND MESSAGE
function sendMsg() {
  const text = document.getElementById("msgInput").value;

  socket.emit("sendMessage", {
    sender: myId,
    receiver: currentChatUser,
    message: text
  });

  document.getElementById("msgInput").value = "";
}


// 📩 RECEIVE MESSAGE
socket.on("newMessage", (msg) => {
  if (
    msg.sender === currentChatUser ||
    msg.receiver === currentChatUser
  ) {
    addMessage(msg);
  }
});

</script>

</body>
</html>
