<script src="/socket.io/socket.io.js"></script>
<link rel="stylesheet" href="style.css">

<h2>Public Chat</h2>

<input id="msg">
<button onclick="send()">Send</button>

<div id="chat"></div>

<script>
const socket = io();

function send(){
 add(msg.value,true);
 socket.emit("public", msg.value);
}

socket.on("public",(m)=>{
 add(m,false);
});

function add(m,me){
 let d=document.createElement("div");
 d.className="msg "+(me?"right":"left");
 d.innerText=m;
 chat.appendChild(d);
}
</script>
