<!DOCTYPE html>
<html>
<head>
  <title>Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="chat-box"></div>
  <input id="msg" placeholder="Type a message...">
  <button onclick="sendMessage()">Send</button>
  <input type="file" id="fileInput" accept="image/*,audio/*">
  <button onclick="sendFile()">📎</button>
  <button id="recordBtn">🎤 Record</button>

  <emoji-picker></emoji-picker>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module">
    import "https://cdn.jsdelivr.net/npm/emoji-picker-element@latest/index.js";

    const socket = io();
    const username = localStorage.getItem("username");
    const room = localStorage.getItem("room");

    socket.emit("login", { username });
    socket.emit("joinRoom", room);

    socket.on("message", (data) => {
      const div = document.createElement("div");
      div.textContent = `${data.user}: ${data.text} (${data.time})`;
      document.getElementById("chat-box").appendChild(div);
    });

    socket.on("typing", (user) => {
      console.log(user + " is typing...");
    });

    function sendMessage() {
      const msg = document.getElementById("msg").value;
      socket.emit("chatMessage", { room, msg });
      document.getElementById("msg").value = "";
    }

    document.getElementById("msg").addEventListener("input", () => {
      socket.emit("typing", room);
    });

    function sendFile() {
      const file = document.getElementById("fileInput").files[0];
      const formData = new FormData();
      formData.append("file", file);

      fetch("/upload", { method: "POST", body: formData })
        .then(res => res.json())
        .then(data => {
          socket.emit("chatMessage", { room, msg: `<img src="${data.file}" style="max-width:200px">` });
        });
    }

    let mediaRecorder;
    let audioChunks = [];
    document.getElementById("recordBtn").onclick = async () => {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.start();

      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        const blob = new Blob(audioChunks, { type: "audio/webm" });
        const formData = new FormData();
        formData.append("file", blob, "voice.webm");

        fetch("/upload", { method: "POST", body: formData })
          .then(res => res.json())
          .then(data => {
            socket.emit("chatMessage", { room, msg: `<audio controls src="${data.file}"></audio>` });
          });
      };

      setTimeout(() => mediaRecorder.stop(), 5000);
    };

    document.querySelector("emoji-picker").addEventListener("emoji-click", event => {
      document.getElementById("msg").value += event.detail.unicode;
    });
  </script>
</body>
</html>
