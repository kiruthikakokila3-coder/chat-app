<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shree Chat App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-screen" class="box">
        <h2>Shree's Portal</h2>
        <input type="text" id="username" placeholder="Enter Your Name" required>
        <select id="chat-mode">
            <option value="public">Public (Infinity Mode)</option>
            <option value="private">Private (2 Member Mode)</option>
        </select>
        <input type="password" id="password" placeholder="Password (for Private)">
        <button onclick="startChat()">Enter Chat</button>
    </div>

    <div id="chat-dashboard" style="display:none;">
        <div class="header">
            <span id="user-display"></span>
            <button onclick="location.reload()" class="exit-btn">Exit</button>
        </div>
        <div id="message-container" class="chat-area"></div>
        <div class="input-area">
            <input type="text" id="msg-input" placeholder="Type a message...">
            <button onclick="sendMsg()">Send</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="socket.js"></script>
</body>
</html>
