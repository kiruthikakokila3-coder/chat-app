<!DOCTYPE html>
<html>
<head>
<title>Chat</title>
<script src="/socket.io/socket.io.js"></script>
</head>

<body style="background:#ffe6ea; font-family:sans-serif">

<h3>💬 Love Chat</h3>
<p>Online: <span id="online">0</span></p>

<div id="chat" style="height:300px; overflow:auto; background:white; padding:10px;"></div>

<input id="msg" placeholder="Type message">
<button onclick="send()">Send</button>

<script>
const socket = io();
const user = localStorage.getItem("user");

socket.emit("join", user);

socket.on("online", (count)=>{
  document.getElementById("online").innerText = count;
});

socket.on("message", (data)=>{
  const div = document.createElement("div");

  if(data.user === user){
    div.style.textAlign = "right";
    div.innerHTML = "<b>You:</b> " + data.msg;
  } else {
    div.style.textAlign = "left";
    div.innerHTML = "<b>"+data.user+":</b> " + data.msg;
  }

  document.getElementById("chat").appendChild(div);
});

function send(){
  const msg = document.getElementById("msg").value;

  socket.emit("message", {
    user: user,
    msg: msg
  });

  document.getElementById("msg").value = "";
}
</script>

</body>
</html>
