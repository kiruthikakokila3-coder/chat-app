<!DOCTYPE html>
<html>
<head>
  <title>Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <!-- Sidebar -->
  <div class="sidebar">
    <h3>Users</h3>
    <ul id="users"></ul>
  </div>

  <!-- Chat Area -->
  <div class="chat">
    <div class="header">
      <h3 id="chatWith">Select user</h3>
      <p id="typing"></p>
    </div>

    <div id="messages"></div>

    <div class="inputBox">
      <input id="message" placeholder="Type message..." />
      <button onclick="sendMessage()">➤</button>
    </div>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>

</body>
</html>
