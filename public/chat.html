<!DOCTYPE html>
<html>
<head>

<body>

<div class="app">

  <div class="header">Chat Room</div>

  <div id="messages"></div>

  <div id="typing"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>

</body>
</html>
