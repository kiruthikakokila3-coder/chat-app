<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Love AI ULTRA 💖</title>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:url("https://wallpaperaccess.com/full/2637581.jpg") no-repeat center/cover;
}

.container{
  width:90%;
  max-width:420px;
  background:rgba(0,0,0,0.7);
  padding:20px;
  border-radius:20px;
  text-align:center;
}

#anime{
  height:200px;
  margin-top:10px;
  border-radius:10px;
  background-size:cover;
}

button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.top{
  display:flex;
  justify-content:space-between;
  font-size:14px;
}

</style>
</head>

<body>

<div class="container">

<h2>💖 Love AI</h2>

<div class="top">
  <span id="score">Score: 0</span>
  <span id="level">Level: 1</span>
</div>

<p id="q"></p>

<button onclick="ans(true)">Yes 💕</button>
<button onclick="ans(false)">No 💔</button>

<p id="res"></p>

<div id="anime"></div>

<br>

<button onclick="speak()">🎤 Speak</button>
<button onclick="listen()">🎧 Voice</button>

</div>

<script>

// questions
const questions=[
"Do you love me?",
"Will you stay forever?",
"Do you miss me?",
"Will you hug me?",
"Will you marry me?",
"Do you think of me daily?"
];

// dialogs
const love=[
"I love you 💖",
"You are mine forever ❤️",
"My heart beats for you 💕",
"You complete me 🥰",
"I need you 💞",
"You are my world 🌍"
];

const sad=[
"That hurts 💔",
"I feel broken 😢",
"Why not me 😭",
"I trusted you 😞",
"My heart is crying 🥀",
"I feel alone 😔"
];

// anime
const normal=[
"https://i.pinimg.com/originals/6d/5e/9f/6d5e9f.gif",
"https://i.pinimg.com/originals/aa/55/cc/aa55cc.gif"
];

const loveImg="https://media.tenor.com/I6kN-6X7nhAAAAAC/anime-love.gif";
const sadImg="https://media.tenor.com/6q0t4v7N6V0AAAAC/anime-run.gif";

let i=0;
let score=0;
let level=1;

function load(){
  q.innerText=questions[i];
  anime.style.backgroundImage=`url(${normal[Math.floor(Math.random()*normal.length)]})`;
}

function ans(a){

  if(a){
    res.innerText=love[i];
    anime.style.backgroundImage=`url(${loveImg})`;
    score+=10;
  }else{
    res.innerText=sad[i];
    anime.style.backgroundImage=`url(${sadImg})`;
  }

  // level system
  if(score>=50) level=2;
  if(score>=100) level=3;

  document.getElementById("score").innerText="Score: "+score;
  document.getElementById("level").innerText="Level: "+level;

  i=(i+1)%questions.length;

  setTimeout(()=>{
    res.innerText="";
    load();
  },2000);
}

// voice speak
function speak(){
  let msg=new SpeechSynthesisUtterance(q.innerText);
  speechSynthesis.speak(msg);
}

// voice listen
function listen(){
  let rec=new(window.SpeechRecognition||window.webkitSpeechRecognition)();
  rec.start();

  rec.onresult=(e)=>{
    let t=e.results[0][0].transcript.toLowerCase();
    if(t.includes("yes")) ans(true);
    else ans(false);
  };
}

// REAL AI (optional connect)
async function askAI(text){
  let res=await fetch("https://api.openai.com/v1/chat/completions",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer YOUR_API_KEY"
    },
    body:JSON.stringify({
      model:"gpt-4o-mini",
      messages:[{role:"user",content:text}]
    })
  });

  let data=await res.json();
  return data.choices[0].message.content;
}

load();

</script>

</body>
</html>
