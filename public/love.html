<h2>Love Calculator ❤️</h2>

<input id="name1" placeholder="Your Name">
<input id="name2" placeholder="Partner Name">

<button onclick="calc()">Check</button>

<h3 id="result"></h3>

<script>
function calc() {
  let n1 = name1.value;
  let n2 = name2.value;

  let percent = Math.floor(Math.random() * 100);

  result.innerText = `${n1} ❤️ ${n2} = ${percent}%`;
}
</script>
