<h2>Choose Chat</h2>

<button onclick="pub()">🌍 Public</button>
<button onclick="pri()">🔒 Private</button>

<script>
function pub(){
  location.href = "chat.html?type=public";
}

function pri(){
  const friend = prompt("Friend name:");
  location.href = "chat.html?type=private&friend="+friend;
}
</script>
