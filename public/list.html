<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Live Room List</title>

<script src="/socket.io/socket.io.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0b141a;
color:white;
}

/* TOP */

.top{
height:70px;
background:#202c33;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
}

.top h2{
font-size:22px;
}

.create-btn{
background:#00a884;
border:none;
padding:10px 15px;
border-radius:10px;
color:white;
cursor:pointer;
}

/* SEARCH */

.search{
padding:15px;
}

.search input{
width:100%;
height:50px;
border:none;
outline:none;
border-radius:12px;
padding:0 15px;
background:#202c33;
color:white;
font-size:15px;
}

/* LIST */

.chat-list{
padding:10px;
display:flex;
flex-direction:column;
gap:10px;
}

/* ROOM */

.room{
background:#202c33;
border-radius:15px;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer;
transition:0.2s;
}

.room:hover{
transform:scale(1.02);
}

.left{
display:flex;
gap:12px;
align-items:center;
}

.avatar{
width:55px;
height:55px;
border-radius:50%;
background:#00a884;
display:flex;
justify-content:center;
align-items:center;
font-size:20px;
font-weight:bold;
}

.info{
display:flex;
flex-direction:column;
gap:5px;
}

.name{
font-size:17px;
font-weight:bold;
}

.last-msg{
font-size:13px;
color:#ccc;
}

.members{
font-size:12px;
color:#00d95f;
}

.private{
color:orange;
}

.right{
display:flex;
flex-direction:column;
align-items:flex-end;
gap:8px;
}

.time{
font-size:11px;
color:#aaa;
}

.badge{
background:red;
min-width:22px;
height:22px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:12px;
padding:0 6px;
}

/* POPUP */

.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
display:none;
justify-content:center;
align-items:center;
}

.popup-box{
width:90%;
max-width:350px;
background:#202c33;
padding:20px;
border-radius:15px;
display:flex;
flex-direction:column;
gap:12px;
}

.popup-box h3{
text-align:center;
}

.popup-box input,
.popup-box select{
height:50px;
border:none;
outline:none;
border-radius:10px;
padding:0 15px;
background:#2a3942;
color:white;
}

.popup-box button{
height:50px;
border:none;
border-radius:10px;
background:#00a884;
color:white;
font-size:15px;
cursor:pointer;
}

.close{
background:red !important;
}

</style>

</head>

<body>

<!-- TOP -->

<div class="top">

<h2>
🔥 Live Rooms
</h2>

<button
class="create-btn"
onclick="openPopup()">

+ Create

</button>

</div>

<!-- SEARCH -->

<div class="search">

<input
type="text"
placeholder="Search room..."
id="searchInput"
onkeyup="searchRoom()">

</div>

<!-- ROOM LIST -->

<div
class="chat-list"
id="chatList">
</div>

<!-- POPUP -->

<div
class="popup"
id="popup">

<div class="popup-box">

<h3>Create Room</h3>

<input
type="text"
id="userName"
placeholder="Your Name">

<input
type="text"
id="roomName"
placeholder="Room Name">

<input
type="password"
id="roomPassword"
placeholder="Password">

<select id="roomType">

<option value="public">
Public Room
</option>

<option value="private">
Private Room
</option>

</select>

<button onclick="createRoom()">
Create Room
</button>

<button
class="close"
onclick="closePopup()">

Close

</button>

</div>

</div>

<script>

const socket = io()

const chatList =
document.getElementById("chatList")

// RECEIVE LIVE ROOMS

socket.on("room list",(rooms)=>{

chatList.innerHTML = ""

rooms.forEach((room)=>{

const div =
document.createElement("div")

div.classList.add("room")

div.innerHTML = `

<div class="left">

<div class="avatar">
${room.roomName.charAt(0).toUpperCase()}
</div>

<div class="info">

<div class="name">
${room.type === "private"
? "🔒"
: "🌍"}

${room.roomName}
</div>

<div class="last-msg">

${room.lastMessage || "No Messages"}

</div>

<div class="members
${room.type}">

${room.users.length}

${room.type === "private"
? "Member"
: "Members"} Online

</div>

</div>

</div>

<div class="right">

<div class="time">

${room.time || "Now"}

</div>

<div class="badge">

${room.unread || 0}

</div>

</div>

`

div.onclick = ()=>{

const name =
prompt("Enter Your Name")

if(!name) return

localStorage.setItem(
"userName",
name
)

localStorage.setItem(
"roomName",
room.roomName
)

localStorage.setItem(
"password",
room.password
)

window.location.href =
"chat.html"

}

chatList.appendChild(div)

})

})

// SEARCH

function searchRoom(){

const input =
document
.getElementById("searchInput")
.value
.toLowerCase()

const rooms =
document
.querySelectorAll(".room")

rooms.forEach((room)=>{

const name =
room
.querySelector(".name")
.innerText
.toLowerCase()

if(name.includes(input)){

room.style.display = "flex"

}else{

room.style.display = "none"

}

})

}

// POPUP

function openPopup(){

document
.getElementById("popup")
.style.display = "flex"

}

function closePopup(){

document
.getElementById("popup")
.style.display = "none"

}

// CREATE ROOM

function createRoom(){

const userName =
document
.getElementById("userName")
.value

const roomName =
document
.getElementById("roomName")
.value

const password =
document
.getElementById("roomPassword")
.value

const type =
document
.getElementById("roomType")
.value

if(
!userName ||
!roomName ||
!password
){

alert("Fill All Fields")

return

}

socket.emit("create room",{

userName,
roomName,
password,
type

})

localStorage.setItem(
"userName",
userName
)

localStorage.setItem(
"roomName",
roomName
)

localStorage.setItem(
"password",
password
)

window.location.href =
"chat.html"

}

</script>

</body>
</html>
