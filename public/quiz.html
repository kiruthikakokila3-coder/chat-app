<h2>Love Quiz 💘</h2>

<p>Do you love someone?</p>
<button onclick="ans('Yes')">Yes</button>
<button onclick="ans('No')">No</button>

<h3 id="out"></h3>

<script>
function ans(a) {
  if (a === "Yes") {
    out.innerText = "True Love 💖";
  } else {
    out.innerText = "Soon Love Coming 😎";
  }
}
</script>
