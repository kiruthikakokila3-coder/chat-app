<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Group Chat 👥</title>

  <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
  <link rel="stylesheet" href="dark.css">

  <style>
    .topbar {
      padding: 10px;
      background: #202c33;
      display: flex;
      gap: 10px;
    }

    .topbar input {
      padding: 8px;
      flex: 1;
      background: #111b21;
      border: none;
      color: #fff;
    }

    .topbar button {
      padding: 8px 12px;
      background: #00a884;
      border: none;
      color: #fff;
      cursor: pointer;
    }

    .group {
      padding: 15px;
      border-bottom: 1px solid #222;
      cursor: pointer;
    }

    .group:hover {
      background: #2a3942;
    }
  </style>
</head>

<body>

<!-- 👥 GROUP LIST -->
<div class="sidebar">
  <div class="topbar">
    <input id="groupName" placeholder="New group name..." />
    <button onclick="createGroup()">Create</button>
  </div>

  <div id="groups"></div>
</div>

<!-- 💬 CHAT -->
<div class="chat">
  <div id="messages" class="messages"></div>

  <div class="input">
    <input id="msgInput" placeholder="Type message..." />
    <button onclick="sendMsg()">Send</button>
  </div>
</div>

<script src="group.js"></script>
</body>
</html>
