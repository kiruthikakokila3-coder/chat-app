<!DOCTYPE html>
<html>
<head>
<title>🔥 Chat App Login</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family: Arial;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: linear-gradient(135deg, #00c6ff, #0072ff);
}

#box {
  background:white;
  padding:30px;
  border-radius:15px;
  width:90%;
  max-width:300px;
  text-align:center;
}

h2 {
  margin-bottom:20px;
}

input {
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
  border:1px solid #ccc;
}

button {
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#0072ff;
  color:white;
  font-size:16px;
}

button:hover {
  background:#0055cc;
}
</style>

</head>

<body>

<div id="box">
  <h2>💬 Chat App</h2>

  <input id="username" placeholder="Enter your name">
  <input id="room" placeholder="Enter room ID">

  <button onclick="join()">Join Chat</button>
</div>

<script>
function join() {
  const username = document.getElementById("username").value;
  const room = document.getElementById("room").value;

  if(!username || !room){
    alert("Enter details!");
    return;
  }

  // redirect to chat page
  window.location.href = `chat.html?username=${username}&room=${room}`;
}
</script>

</body>
</html>
