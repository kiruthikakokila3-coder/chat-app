<!DOCTYPE html>
<html>
<body>
    <h2>Login</h2>
    <input id="name" placeholder="Enter username">
    <button onclick="login()">Enter Chat</button>

    <script>
        function login() {
            const name = document.getElementById("name").value;
            localStorage.setItem("username", name);
            window.location = "chat.html";
        }
    </script>
</body>
</html>
