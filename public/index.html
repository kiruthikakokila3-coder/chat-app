<!DOCTYPE html>
<html>
<head>
  <title>Login</title>

  <!-- MOBILE FIX -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #ece5dd;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      width: 90%;
      max-width: 300px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }

    button {
      margin-top: 10px;
      padding: 10px;
      width: 100%;
      background: #075e54;
      color: white;
      border: none;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Enter Name</h2>
  <input id="username" placeholder="Your name" />
  <button onclick="join()">Join Chat</button>
</div>

<script>
function join() {
  const name = document.getElementById("username").value;

  if (!name) {
    alert("Enter name");
    return;
  }

  localStorage.setItem("username", name);
  window.location.href = "chat.html";
}
</script>

</body>
</html>
