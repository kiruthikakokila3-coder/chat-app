<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join</title>
</head>

<body>

<h2>Join Chat</h2>

<input id="name" placeholder="Name"><br><br>
<input id="room" placeholder="Room"><br><br>
<input id="pass" placeholder="Password (optional)"><br><br>

<input type="file" id="dp"><br><br>

<button onclick="join()">Join</button>

<script>
function join() {
  const name = document.getElementById("name").value;
  const room = document.getElementById("room").value;
  const pass = document.getElementById("pass").value;

  const file = document.getElementById("dp").files[0];

  let reader = new FileReader();

  reader.onload = function() {
    localStorage.setItem("username", name);
    localStorage.setItem("room", room);
    localStorage.setItem("password", pass);
    localStorage.setItem("dp", reader.result);

    window.location = "chat.html";
  };

  if (file) {
    reader.readAsDataURL(file);
  } else {
    localStorage.setItem("dp", "");
    reader.onload();
  }
}
</script>

</body>
</html>
