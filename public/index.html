<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shree's Private Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login-screen" class="box">
    <h2>Welcome to Shree Portal</h2>

    <input type="text" id="username" placeholder="Enter Your Name" required>

    <select id="chat-mode">
        <option value="public">Public</option>
        <option value="private">Private</option>
    </select>

    <input type="password" id="password" placeholder="Room Password" required>

    <button onclick="startChat()">Enter Portal</button>
</div>

<div id="chat-dashboard" style="display:none;">
    
    <div class="header">
        <span id="user-display"></span>
        <button onclick="location.reload()">Exit</button>
    </div>

    <!-- ✅ Books option (UNCHANGED) -->
    <div class="books-nav">
        <a href="https://anyflip.com/explore?q=kids" target="_blank">👶 Kids</a>
        <a href="https://anyflip.com/explore?q=anime" target="_blank">🏮 Anime</a>
        <a href="https://anyflip.com/explore?q=horror" target="_blank">👻 Horror</a>
    </div>

    <div id="message-container"></div>

    <input type="text" id="msg-input" placeholder="Type message">
    <button onclick="sendMsg()">Send</button>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="socket.js"></script>

</body>
</html>
