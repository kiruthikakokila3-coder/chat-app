<!DOCTYPE html>
<html>
<head>
<title>Love App</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<h2>💖 Love App Login</h2>

<input id="u" placeholder="Username">
<input id="p" placeholder="Password">
<button onclick="login()">Login</button>

<div id="menu" style="display:none;">
  <h3>Select</h3>
  <button onclick="go('chat.html')">Public Chat</button>
  <button onclick="go('room.html')">Private Chat</button>
  <button onclick="go('love.html')">Love %</button>
  <button onclick="go('quiz.html')">Love Quiz</button>
  <button onclick="go('books.html')">Books</button>
</div>

<script>
function login(){
 fetch(`/login?username=${u.value}&password=${p.value}`)
 .then(r=>r.json())
 .then(d=>{
   if(d.success){
     menu.style.display="block";
   }else{
     alert("Wrong login");
   }
 });
}

function go(p){
 location=p;
}
</script>

</body>
</html>
