<!DOCTYPE html>
<html>
<head>
<title>Love Chat</title>
</head>
<body>

<h2>Login</h2>
<input id="user" placeholder="username">
<input id="pass" placeholder="password">
<button onclick="login()">Login</button>

<div id="menu" style="display:none;">
  <h3>Select</h3>
  <button onclick="go('chat.html')">Public Chat</button>
  <button onclick="go('room.html')">Private Chat</button>
  <button onclick="go('love.html')">Love %</button>
  <button onclick="go('quiz.html')">Love Quiz</button>
  <button onclick="go('books.html')">Books</button>
</div>

<script>
function login() {
  let u = user.value;
  let p = pass.value;

  fetch(`/login?username=${u}&password=${p}`)
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        menu.style.display = "block";
      } else {
        alert("Wrong login");
      }
    });
}

function go(page) {
  window.location = page;
}
</script>

</body>
</html>
